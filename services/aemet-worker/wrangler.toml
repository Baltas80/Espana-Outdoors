name = "espana-outdoor-aemet"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = false

[vars]
OIDC_ISSUER = "https://<keycloak-host>/realms/<realm>"
OIDC_AUDIENCE = "<client-id>"
OIDC_REQUIRED_ROLE = "source.read"
OIDC_JWKS_URL = "https://<keycloak-host>/realms/<realm>/protocol/openid-connect/certs"

# Add the AEMET credential only with:
#   npx wrangler secret put AEMET_API_KEY
# Never put credentials in vars, wrangler.toml, .dev.vars committed to Git, or GitHub Actions logs.
# Before any deployment, confirm that all limits and settings remain on the Cloudflare Free plan.
