openapi: 3.1.0
info:
  title: España Outdoor Live Data Gateway
  version: 0.3.0
  description: Provider-neutral boundary for official and licensed outdoor data.
servers:
  - url: https://api.example.invalid
paths:
  /health:
    get:
      security: []
      operationId: health
      responses:
        '200':
          description: Gateway health
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
  /v1/weather:
    get:
      security:
        - bearerAuth: []
      operationId: getWeather
      summary: Get municipal daily weather with provenance
      parameters:
        - name: municipalityCode
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{5}$'
      responses:
        '200':
          description: Weather response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '400':
          description: Invalid municipality code
        '401':
          description: Unauthorized
        '429':
          description: Rate limit exceeded
        '503':
          description: Provider unavailable
  /v1/maps/catalog:
    get:
      security: []
      operationId: getOfflineMapCatalog
      summary: Get available offline map packages
      responses:
        '200':
          description: Offline map catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapCatalogEnvelope'
        '429':
          description: Rate limit exceeded
        '503':
          description: Offline catalog unavailable

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Provenance:
      type: object
      required:
        - sourceId
        - sourceName
        - retrievedAt
        - freshnessState
        - confidence
      properties:
        sourceId:
          type: string
        sourceName:
          type: string
        sourceUrl:
          type: string
          format: uri
        license:
          type: string
        attribution:
          type: string
        retrievedAt:
          type: string
          format: date-time
        sourceUpdatedAt:
          type: string
          format: date-time
        validFrom:
          type: string
          format: date-time
        validUntil:
          type: string
          format: date-time
        freshnessState:
          type: string
          enum: [fresh, stale, unavailable, unknown]
        confidence:
          type: number
          minimum: 0
          maximum: 1
        adapterVersion:
          type: string

    DataEnvelope:
      type: object
      required: [data, provenance]
      properties:
        data:
          type: object
          additionalProperties: true
        provenance:
          $ref: '#/components/schemas/Provenance'

    Bounds:
      type: object
      required: [west, south, east, north]
      properties:
        west:
          type: number
          minimum: -180
          maximum: 180
        south:
          type: number
          minimum: -90
          maximum: 90
        east:
          type: number
          minimum: -180
          maximum: 180
        north:
          type: number
          minimum: -90
          maximum: 90

    MapPackage:
      type: object
      required:
        - id
        - name
        - providerId
        - version
        - uri
        - sha256
        - bytes
        - bounds
        - minZoom
        - maxZoom
      properties:
        id:
          type: string
        name:
          type: string
        providerId:
          type: string
        version:
          type: string
        uri:
          type: string
          format: uri
        sha256:
          type: string
          pattern: '^[A-Fa-f0-9]{64}$'
        bytes:
          type: integer
          minimum: 1
        license:
          type: string
        attribution:
          type: string
        bounds:
          $ref: '#/components/schemas/Bounds'
        minZoom:
          type: integer
          minimum: 0
        maxZoom:
          type: integer
          minimum: 0

    MapCatalogEnvelope:
      type: object
      required: [data, provenance]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MapPackage'
        provenance:
          $ref: '#/components/schemas/Provenance'
