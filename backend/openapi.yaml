openapi: 3.1.0
info:
  title: España Outdoor Live Data Gateway
  version: 0.4.0
  description: Provider-neutral boundary for official and licensed outdoor data.
servers:
  - url: https://api.example.invalid

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Provenance:
      type: object
      required: [sourceId, sourceName, retrievedAt, freshnessState, confidence]
      properties:
        sourceId: {type: string}
        sourceName: {type: string}
        sourceUrl: {type: string, format: uri}
        license: {type: string}
        attribution: {type: string}
        retrievedAt: {type: string, format: date-time}
        sourceUpdatedAt: {type: string, format: date-time}
        validFrom: {type: string, format: date-time}
        validUntil: {type: string, format: date-time}
        freshnessState:
          type: string
          enum: [fresh, stale, unavailable, unknown]
        confidence: {type: number, minimum: 0, maximum: 1}
        adapterVersion: {type: string}

    DataEnvelope:
      type: object
      required: [data, provenance]
      properties:
        data:
          type: object
          additionalProperties: true
        provenance:
          $ref: '#/components/schemas/Provenance'

    Bounds:
      type: object
      required: [west, south, east, north]
      properties:
        west: {type: number, minimum: -180, maximum: 180}
        south: {type: number, minimum: -90, maximum: 90}
        east: {type: number, minimum: -180, maximum: 180}
        north: {type: number, minimum: -90, maximum: 90}

    MapPackage:
      type: object
      required: [id, name, providerId, version, uri, sha256, bytes, bounds, minZoom, maxZoom]
      properties:
        id: {type: string}
        name: {type: string}
        providerId: {type: string}
        version: {type: string}
        uri: {type: string, format: uri}
        sha256: {type: string, pattern: '^[A-Fa-f0-9]{64}$'}
        bytes: {type: integer, minimum: 1}
        license: {type: string}
        attribution: {type: string}
        bounds:
          $ref: '#/components/schemas/Bounds'
        minZoom: {type: integer, minimum: 0}
        maxZoom: {type: integer, minimum: 0}

    MapCatalogEnvelope:
      type: object
      required: [data, provenance]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MapPackage'
        provenance:
          $ref: '#/components/schemas/Provenance'

    Alert:
      type: object
      required: [id, authority, type, severity, confidence, title, sourceName, sourceUrl, issuedAt, updatedAt, validUntil]
      properties:
        id: {type: string}
        authority:
          type: string
          enum: [official, espanaOutdoor]
        type:
          type: string
          enum: [wildfire, flood, storm, wind, snow, heat, cold, earthquake, tsunami, volcano, landslide, closure, other]
        severity:
          type: string
          enum: [information, caution, danger, emergency]
        confidence:
          type: string
          enum: [confirmed, probable, preliminary, unknown]
        title: {type: string}
        description: {type: string}
        sourceName: {type: string}
        sourceUrl: {type: string, format: uri}
        issuedAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        validUntil: {type: string, format: date-time}
        regionId: {type: string}
        latitude: {type: number, minimum: -90, maximum: 90}
        longitude: {type: number, minimum: -180, maximum: 180}
        radiusKm: {type: number, exclusiveMinimum: 0}

    AlertCollection:
      type: object
      required: [alerts, generatedAt]
      properties:
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/Alert'
        generatedAt: {type: string, format: date-time}

paths:
  /health:
    get:
      security: []
      operationId: health
      responses:
        '200':
          description: Gateway health
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string}

  /v1/weather:
    get:
      security:
        - bearerAuth: []
      operationId: getWeather
      summary: Get municipal daily weather with provenance
      parameters:
        - name: municipalityCode
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{5}$'
      responses:
        '200':
          description: Weather response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '400': {description: Invalid municipality code}
        '401': {description: Unauthorized}
        '429': {description: Rate limit exceeded}
        '503': {description: Provider unavailable}

  /v1/maps/catalog:
    get:
      security: []
      operationId: getOfflineMapCatalog
      summary: Get available offline map packages
      responses:
        '200':
          description: Offline map catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapCatalogEnvelope'
        '429': {description: Rate limit exceeded}
        '503': {description: Offline catalog unavailable}

  /v1/alerts:
    get:
      security: []
      operationId: getAlerts
      summary: Get active geolocated safety alerts
      parameters:
        - name: lat
          in: query
          required: true
          schema: {type: number, minimum: -90, maximum: 90}
        - name: lon
          in: query
          required: true
          schema: {type: number, minimum: -180, maximum: 180}
        - name: radiusKm
          in: query
          schema: {type: number, minimum: 0, maximum: 500, default: 25}
      responses:
        '200':
          description: Active alerts with provenance
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DataEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AlertCollection'
        '400': {description: Invalid alert query}
        '429': {description: Rate limit exceeded}
        '503': {description: Alert catalog unavailable}
