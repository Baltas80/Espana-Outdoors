openapi: 3.1.0
info:
  title: España Outdoor Live Data Gateway
  version: 0.1.0
  description: Provider-neutral boundary for official and licensed live outdoor data.
servers:
  - url: https://api.example.invalid
paths:
  /v1/weather:
    get:
      operationId: getWeather
      summary: Get normalized weather with provenance
      parameters:
        - name: lat
          in: query
          required: true
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: lon
          in: query
          required: true
          schema: { type: number, minimum: -180, maximum: 180 }
      responses:
        '200':
          description: Normalized weather response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '401': { description: Authentication required }
        '429': { description: Rate limit exceeded }
        '503': { description: Provider unavailable; response must not be treated as fresh }
  /v1/health/providers:
    get:
      operationId: providerHealth
      summary: Provider health without exposing credentials
      responses:
        '200':
          description: Provider health summary
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    DataEnvelope:
      type: object
      required: [data, provenance]
      properties:
        data:
          type: object
          additionalProperties: true
        provenance:
          $ref: '#/components/schemas/Provenance'
    Provenance:
      type: object
      required: [sourceId, sourceName, retrievedAt, freshnessState, confidence]
      properties:
        sourceId: { type: string }
        sourceName: { type: string }
        sourceUrl: { type: string, format: uri }
        license: { type: string }
        attribution: { type: string }
        retrievedAt: { type: string, format: date-time }
        sourceUpdatedAt: { type: string, format: date-time }
        validFrom: { type: string, format: date-time }
        validUntil: { type: string, format: date-time }
        freshnessState:
          type: string
          enum: [fresh, stale, unavailable, unknown]
        confidence:
          type: number
          minimum: 0
          maximum: 1
        adapterVersion: { type: string }
security:
  - bearerAuth: []
