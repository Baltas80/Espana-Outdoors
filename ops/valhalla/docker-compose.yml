services:
  valhalla:
    image: ghcr.io/valhalla/valhalla:3.9.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8002"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./data:/data/valhalla
      - ./config:/config:ro
    command: ["valhalla_service", "/config/valhalla.json", "2"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8002/status >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
