name: Android staging

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'lib/**'
      - 'lib/infrastructure/routing/**'
      - 'lib/core/routing/**'
      - 'lib/features/map/**'
      - 'lib/core/maps/**'
      - 'tool/configure_mobile_native.py'
      - 'tool/verify_android_release.py'
      - 'tool/verify_valhalla_route.py'
      - 'ops/offline/prepare-agus-base-maps.sh'
      - 'test/**'
      - 'assets/**'
      - 'tool/verify_mobile_native.py'
      - 'pubspec.yaml'
      - '.github/workflows/staging-android.yml'

permissions:
  contents: read

env:
  APP_ENV: staging
  AGUS_MAPS_VERSION: 0.1.17
  MAP_PMTILES_URL: https://espana-outdoor-r2-uploader.espana-outdoor.workers.dev/basemap/spain/2026-09-28/spain.pmtiles
  OFFLINE_CATALOG_URL: https://espana-outdoor-r2-uploader.espana-outdoor.workers.dev/catalog/spain.json
  VALHALLA_BASE_URL: https://routing.espanaoutdoor.es
  SOURCE_GATEWAY_BASE_URL: https://api.espanaoutdoor.es
  RESCUE_LINK_BASE_URL: https://rescue.espanaoutdoor.es
  OIDC_ISSUER: https://auth.espanaoutdoor.es/realms/espana-outdoor
  OIDC_CLIENT_ID: espana-outdoors-mobile
  OIDC_REDIRECT_URI: com.espanaoutdoors://oauth2redirect
  MAP_ATTRIBUTION: "© OpenStreetMap contributors"

jobs:
  android-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check staging endpoints
        shell: bash
        run: |
          set -euo pipefail
          for name in MAP_PMTILES_URL VALHALLA_BASE_URL OFFLINE_CATALOG_URL SOURCE_GATEWAY_BASE_URL RESCUE_LINK_BASE_URL OIDC_ISSUER; do
            value="${!name:-}"
            test -n "$value"
            case "$value" in https://*) ;; *) echo "$name must use HTTPS"; exit 1;; esac
          done

      - name: Verify staging build profile
        run: python3 tool/verify_build_profile.py --profile staging

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Download Agus Maps SDK
        shell: bash
        run: |
          set -euo pipefail
          version="0.1.17"
          archive="$RUNNER_TEMP/agus-maps-sdk-v${version}.zip"
          root="$RUNNER_TEMP/agus-maps-sdk"
          curl -fL --retry 5 --retry-all-errors --connect-timeout 20 --max-time 900 \
            "https://github.com/agus-works/agus-maps-flutter/releases/download/v${version}/agus-maps-sdk-v${version}.zip" \
            -o "$archive"
          rm -rf "$root"
          mkdir -p "$root"
          unzip -q "$archive" -d "$root"
          sdk_home="$(find "$root" -type d -path '*/android/prebuilt' -print -quit)"
          test -n "$sdk_home"
          sdk_home="${sdk_home%/android/prebuilt}"
          test -d "$sdk_home/assets" || test -d "$sdk_home/example/assets"
          echo "AGUS_MAPS_HOME=$sdk_home" >> "$GITHUB_ENV"
          echo "Agus Maps SDK: $sdk_home"

      - name: Prepare CoMaps base maps
        shell: bash
        run: |
          set -euo pipefail
          COMAPS_BASE_SNAPSHOT=260106 bash ops/offline/prepare-agus-base-maps.sh

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create . --platforms=android --org com.espanaoutdoors

      - name: Apply Android native configuration
        run: python3 tool/configure_mobile_native.py --platform android

      - name: Verify Android native configuration
        run: python3 tool/verify_mobile_native.py --platform android

      - name: Dependencies
        run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze --no-fatal-infos
          flutter test --coverage

      - name: Build Android staging APK
        run: |
          flutter build apk --release \
            --dart-define=APP_ENV="$APP_ENV" \
            --dart-define=MAP_PMTILES_URL="$MAP_PMTILES_URL" \
            --dart-define=VALHALLA_BASE_URL="$VALHALLA_BASE_URL" \
            --dart-define=SOURCE_GATEWAY_BASE_URL="$SOURCE_GATEWAY_BASE_URL" \
            --dart-define=OFFLINE_CATALOG_URL="$OFFLINE_CATALOG_URL" \
            --dart-define=RESCUE_LINK_BASE_URL="$RESCUE_LINK_BASE_URL" \
            --dart-define=OIDC_ISSUER="$OIDC_ISSUER" \
            --dart-define=OIDC_CLIENT_ID="$OIDC_CLIENT_ID" \
            --dart-define=OIDC_REDIRECT_URI="$OIDC_REDIRECT_URI" \
            --dart-define=MAP_ATTRIBUTION="$MAP_ATTRIBUTION"

      - name: Verify APK
        run: |
          apk="$(find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$apk"
          python3 tool/verify_android_release.py --apk "$apk"

      - name: Preserve staging APK before map smoke
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$apk"
          cp "$apk" "$RUNNER_TEMP/android-staging-normal.apk"

      - name: Build map smoke APK
        run: |
          flutter build apk --release             --dart-define=APP_ENV="$APP_ENV"             --dart-define=MAP_SMOKE=true             --dart-define=MAP_PMTILES_URL="$MAP_PMTILES_URL"             --dart-define=VALHALLA_BASE_URL="$VALHALLA_BASE_URL"             --dart-define=SOURCE_GATEWAY_BASE_URL="$SOURCE_GATEWAY_BASE_URL"             --dart-define=OFFLINE_CATALOG_URL="$OFFLINE_CATALOG_URL"             --dart-define=RESCUE_LINK_BASE_URL="$RESCUE_LINK_BASE_URL"             --dart-define=OIDC_ISSUER="$OIDC_ISSUER"             --dart-define=OIDC_CLIENT_ID="$OIDC_CLIENT_ID"             --dart-define=OIDC_REDIRECT_URI="$OIDC_REDIRECT_URI"             --dart-define=MAP_ATTRIBUTION="$MAP_ATTRIBUTION"

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Android map native smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash tool/smoke_android_map.sh build/app/outputs/flutter-apk/app-release.apk

      - name: Restore normal staging APK
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/android-staging-normal.apk" build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Android staging APK
        uses: actions/upload-artifact@v7
        with:
          name: android-staging-apk
          path: build/app/outputs/flutter-apk/*.apk
