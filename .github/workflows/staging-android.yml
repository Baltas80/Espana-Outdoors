name: Android staging

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'lib/features/routes/**'
      - 'lib/infrastructure/routing/**'
      - 'lib/core/routing/**'
      - 'lib/features/map/**'
      - 'lib/core/maps/**'
      - 'tool/configure_mobile_native.py'
      - 'tool/verify_mobile_native.py'
      - 'pubspec.yaml'
      - '.github/workflows/staging-android.yml'

permissions:
  contents: read

env:
  APP_ENV: staging
  MAP_PMTILES_URL: https://espana-outdoor-r2-uploader.espana-outdoor.workers.dev/basemap/spain/2026-09-28/spain.pmtiles
  OFFLINE_CATALOG_URL: https://espana-outdoor-r2-uploader.espana-outdoor.workers.dev/catalog/spain.json
  VALHALLA_BASE_URL: https://routing.espanaoutdoor.es
  SOURCE_GATEWAY_BASE_URL: https://api.espanaoutdoor.es
  RESCUE_LINK_BASE_URL: https://rescue.espanaoutdoor.es
  OIDC_ISSUER: https://auth.espanaoutdoor.es/realms/espana-outdoor
  OIDC_CLIENT_ID: espana-outdoors-mobile
  OIDC_REDIRECT_URI: com.espanaoutdoors://oauth2redirect
  MAP_ATTRIBUTION: "© OpenStreetMap contributors"

jobs:
  android-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check staging endpoints
        shell: bash
        run: |
          set -euo pipefail
          for name in MAP_PMTILES_URL VALHALLA_BASE_URL OFFLINE_CATALOG_URL SOURCE_GATEWAY_BASE_URL RESCUE_LINK_BASE_URL OIDC_ISSUER; do
            value="${!name:-}"
            test -n "$value"
            case "$value" in https://*) ;; *) echo "$name must use HTTPS"; exit 1;; esac
          done

      - name: Staging integration smoke
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 "${OIDC_ISSUER}/.well-known/openid-configuration" >/dev/null
          curl --fail --silent --show-error --location --max-time 20 "${VALHALLA_BASE_URL}/status" >/dev/null
          curl --fail --silent --show-error --location --max-time 20 "${SOURCE_GATEWAY_BASE_URL}/healthz" >/dev/null
          curl --fail --silent --show-error --location --max-time 20 "${RESCUE_LINK_BASE_URL}/healthz" >/dev/null

      - name: Verify staging build profile
        run: python3 tool/verify_build_profile.py --profile staging

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Agus Maps SDK
        shell: bash
        run: |
          set -euo pipefail
          version="0.1.17"
          archive="$RUNNER_TEMP/agus-maps-sdk-v${version}.zip"
          root="$RUNNER_TEMP/agus-maps-sdk"
          url="https://api.github.com/repos/agus-works/agus-maps-flutter/releases/assets/343726328"
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 20 --max-time 900 -H "Accept: application/octet-stream" -o "$archive" "$url"
          echo "f9887e016fc2538cf37b4af01725720c018b45a3acfdd94ab6b222d7aca3e884  $archive" | sha256sum -c -
          rm -rf "$root"
          mkdir -p "$root"
          unzip -q "$archive" -d "$root"
          sdk_home="$(find "$root" -type d -path '*/android/prebuilt' -print -quit)"
          test -n "$sdk_home"
          sdk_home="${sdk_home%/android/prebuilt}"
          echo "AGUS_MAPS_HOME=$sdk_home" >> "$GITHUB_ENV"
          echo "Agus Maps SDK: $sdk_home"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create . --platforms=android --org com.espanaoutdoors

      - name: Apply Android native configuration
        run: python3 tool/configure_mobile_native.py --platform android

      - name: Verify Android native configuration
        run: python3 tool/verify_mobile_native.py --platform android

      - name: Dependencies
        run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze --no-fatal-infos
          flutter test --coverage

      - name: Build Android staging APK
        run: |
          flutter build apk --release \
            --dart-define=APP_ENV="$APP_ENV" \
            --dart-define=MAP_PMTILES_URL="$MAP_PMTILES_URL" \
            --dart-define=VALHALLA_BASE_URL="$VALHALLA_BASE_URL" \
            --dart-define=SOURCE_GATEWAY_BASE_URL="$SOURCE_GATEWAY_BASE_URL" \
            --dart-define=OFFLINE_CATALOG_URL="$OFFLINE_CATALOG_URL" \
            --dart-define=RESCUE_LINK_BASE_URL="$RESCUE_LINK_BASE_URL" \
            --dart-define=OIDC_ISSUER="$OIDC_ISSUER" \
            --dart-define=OIDC_CLIENT_ID="$OIDC_CLIENT_ID" \
            --dart-define=OIDC_REDIRECT_URI="$OIDC_REDIRECT_URI" \
            --dart-define=MAP_ATTRIBUTION="$MAP_ATTRIBUTION"

      - name: Verify APK
        run: |
          apk="$(find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$apk"
          python3 tool/verify_android_release.py --apk "$apk"

      - name: Upload Android staging APK
        uses: actions/upload-artifact@v7
        with:
          name: android-staging-apk
          path: build/app/outputs/flutter-apk/*.apk
