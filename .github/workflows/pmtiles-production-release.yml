name: PMTiles production release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Immutable basemap version'
        required: true
        type: string

env:
  VERSION: ${{ inputs.version }}

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: maps-production
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y awscli

      - name: Build PMTiles
        shell: bash
        run: |
          set -euo pipefail
          DATA_DIR="$PWD/build/maps" OUTPUT="$PWD/build/maps/spain.pmtiles" \
            bash ops/offline/build-spain-pmtiles.sh

      - name: Verify PMTiles archive
        shell: bash
        run: |
          set -euo pipefail
          ./pmtiles verify build/maps/spain.pmtiles
          ./pmtiles show build/maps/spain.pmtiles | tee build/maps/spain.pmtiles.metadata.txt

      - name: Upload immutable PMTiles to R2
        shell: bash
        run: |
          set -euo pipefail
          export AWS_ACCESS_KEY_ID="${R2_ACCESS_KEY_ID}"
          export AWS_SECRET_ACCESS_KEY="${R2_SECRET_ACCESS_KEY}"
          export AWS_DEFAULT_REGION=auto
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          prefix="basemap/spain/${VERSION}"
          checksum="$(cut -d' ' -f1 build/maps/spain.pmtiles.sha256)"
          size="$(stat -c '%s' build/maps/spain.pmtiles)"

          if aws s3api head-object \
            --bucket "${R2_BUCKET}" \
            --key "${prefix}/spain.pmtiles" \
            --endpoint-url "${endpoint}" >/dev/null 2>&1; then
            echo "ERROR: immutable PMTiles object already exists at ${prefix}/spain.pmtiles" >&2
            exit 1
          fi

          aws s3api put-object \
            --bucket "${R2_BUCKET}" \
            --key "${prefix}/spain.pmtiles" \
            --body build/maps/spain.pmtiles \
            --endpoint-url "${endpoint}" \
            --content-type application/octet-stream \
            --metadata "sha256=${checksum}" \
            --if-none-match '*'

          aws s3 cp build/maps/spain.pmtiles.sha256 "s3://${R2_BUCKET}/${prefix}/spain.pmtiles.sha256" \
            --endpoint-url "${endpoint}" \
            --content-type text/plain

          remote_size="$(aws s3api head-object \
            --bucket "${R2_BUCKET}" \
            --key "${prefix}/spain.pmtiles" \
            --endpoint-url "${endpoint}" \
            --query ContentLength \
            --output text)"

          remote_sha="$(aws s3api head-object \
            --bucket "${R2_BUCKET}" \
            --key "${prefix}/spain.pmtiles" \
            --endpoint-url "${endpoint}" \
            --query Metadata.sha256 \
            --output text)"

          test "${remote_size}" = "${size}"
          test "${remote_sha}" = "${checksum}"

      - name: Publish immutable catalog entry
        shell: bash
        run: |
          set -euo pipefail
          export MAP_SHA256="$(cut -d' ' -f1 build/maps/spain.pmtiles.sha256)"
          export MAP_SIZE_BYTES="$(stat -c '%s' build/maps/spain.pmtiles)"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          out = Path('build/maps/catalog-entry.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps({
              'version': os.environ['VERSION'],
              'sha256': os.environ['MAP_SHA256'],
              'size_bytes': int(os.environ['MAP_SIZE_BYTES']),
              'path': f"basemap/spain/{os.environ['VERSION']}/spain.pmtiles",
          }, sort_keys=True, indent=2) + '\n')
          PY

          aws s3api put-object \
            --bucket "${R2_BUCKET}" \
            --key "basemap/spain/catalog/${VERSION}.json" \
            --body build/maps/catalog-entry.json \
            --endpoint-url "${endpoint}" \
            --content-type application/json \
            --if-none-match '*'

      - name: Verify HTTPS range request
        shell: bash
        run: |
          set -euo pipefail
          url="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com/${R2_BUCKET}/basemap/spain/${VERSION}/spain.pmtiles"
          curl --fail --silent --show-error --range 0-15 -D /tmp/headers.bin -o /tmp/range.bin "${url}"
          grep -qi '^HTTP/.*206' /tmp/headers.bin
          grep -qi '^content-range: bytes 0-15/' /tmp/headers.bin
          test "$(stat -c '%s' /tmp/range.bin)" = 16
