name: Temporary Dart lockfile bootstrap

on:
  push:
    branches:
      - fix/reproducible-android-baseline-20261011
    paths:
      - .github/workflows/bootstrap-dart-lock.yml
      - pubspec.yaml

permissions:
  contents: write

jobs:
  resolve-and-commit-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout baseline branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref_name }}
      - name: Set up pinned Flutter SDK
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Resolve Dart dependencies
        run: flutter pub get
      - name: Commit generated pubspec.lock
        shell: bash
        run: |
          set -euo pipefail
          test -s pubspec.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock
          if git diff --cached --quiet; then
            echo "pubspec.lock is already unchanged."
            exit 0
          fi
          git commit -m "build: lock resolved Dart dependencies"
          git push origin "HEAD:${GITHUB_REF_NAME}"
