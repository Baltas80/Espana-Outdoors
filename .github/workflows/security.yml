name: Security baseline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Outdated dependency report
        run: flutter pub outdated

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      # Gitleaks needs repository history for PR range scanning. A shallow
      # checkout can leave the base/parent SHA unavailable and make the scan
      # fail before it actually inspects content.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
