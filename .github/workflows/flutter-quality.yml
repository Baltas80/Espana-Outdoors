name: Flutter Quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format report
        run: |
          set +e
          dart format --output=none lib test
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::warning::Dart formatter reports files that would be reformatted. Formatting is reported but does not block analysis/tests."
          fi
          exit 0
      - run: flutter analyze lib test
      - run: flutter test
