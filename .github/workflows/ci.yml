name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate mobile platform projects
        run: flutter create . --platforms=android,ios --org com.espanaoutdoors

      - name: Apply Android native configuration
        run: python3 tool/configure_mobile_native.py --platform android

      - name: Dependencies
        run: flutter pub get

      - name: Map provider guard
        run: dart run tool/check_map_provider_usage.dart

      - name: Live data provider guard
        run: dart run tool/check_live_data_provider_usage.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Focused routing/offline/safety tests
        run: >-
          flutter test
          test/routing_config_test.dart
          test/offline_region_test.dart
          test/valhalla_routing_service_test.dart
          test/core/route_recording_store_test.dart
          test/core/offline_package_verifier_test.dart
          test/core/offline_sync_store_test.dart
          test/core/offline_sync_runner_test.dart
          test/core/emergency_share_service_test.dart
          test/core/rescue_link_policy_test.dart
          test/remote_source_gateway_test.dart
          test/gateway_weather_service_test.dart
          test/source_gateway_config_test.dart

      - name: Full test suite
        run: flutter test --coverage

      - name: Android release build
        run: |
          flutter build apk --release
          flutter build appbundle --release

      - name: Generate Android release manifest
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          aab="$(find build/app/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' | head -n 1)"
          test -n "$apk"
          test -n "$aab"
          flutter_version="$(flutter --version | head -n 1)"
          {
            echo "commit=${GITHUB_SHA}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "flutter=${flutter_version}"
            echo "apk_file=$(basename "$apk")"
            echo "apk_size_bytes=$(stat -c '%s' "$apk")"
            echo "apk_sha256=$(sha256sum "$apk" | cut -d ' ' -f1)"
            echo "aab_file=$(basename "$aab")"
            echo "aab_size_bytes=$(stat -c '%s' "$aab")"
            echo "aab_sha256=$(sha256sum "$aab" | cut -d ' ' -f1)"
          } > build/android-release-manifest.txt

      - name: Upload Android build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
            build/android-release-manifest.txt

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info

  ios-build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate iOS project
        run: flutter create . --platforms=ios --org com.espanaoutdoors

      - name: Apply iOS native configuration
        run: python3 tool/configure_mobile_native.py --platform ios

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: iOS focused safety and offline tests
        run: >-
          flutter test
          test/routing_config_test.dart
          test/offline_region_test.dart
          test/valhalla_routing_service_test.dart
          test/core/route_recording_store_test.dart
          test/core/offline_package_verifier_test.dart
          test/core/offline_sync_store_test.dart
          test/core/offline_sync_runner_test.dart
          test/core/emergency_share_service_test.dart
          test/core/rescue_link_policy_test.dart
          test/remote_source_gateway_test.dart

      - name: Verify iOS native location configuration
        run: |
          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          path = Path('ios/Runner/Info.plist')
          with path.open('rb') as handle:
              plist = plistlib.load(handle)

          required = {
              'NSLocationWhenInUseUsageDescription',
              'NSLocationAlwaysAndWhenInUseUsageDescription',
          }
          missing = sorted(required - plist.keys())
          if missing:
              raise SystemExit(f'Missing iOS location usage descriptions: {missing}')

          if 'location' not in plist.get('UIBackgroundModes', []):
              raise SystemExit('Missing iOS background location mode.')
          PY

      - name: iOS release build
        run: flutter build ios --release --no-codesign

  rescue-link:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/rescue-link
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: services/rescue-link/go.mod

      - name: Tidy and verify Go modules
        run: go mod tidy

      - name: Show Go module diff
        run: git diff -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Tests
        run: go test ./...

      - name: Container build
        run: docker build -t espana-outdoors-rescue-link:ci .


  source-gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/source-gateway
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: services/source-gateway/go.mod

      - name: Tidy and verify Go modules
        run: go mod tidy

      - name: Show Go module diff
        run: git diff -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Tests
        run: go test ./...

      - name: Container build
        run: docker build -t espana-outdoors-source-gateway:ci .