name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate mobile platform projects
        run: flutter create . --platforms=android,ios --org com.espanaoutdoors

      - name: Apply mobile native configuration
        run: python3 tool/configure_mobile_native.py

      - name: Dependencies
        run: flutter pub get

      - name: Map provider guard
        run: dart run tool/check_map_provider_usage.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Focused routing/offline/safety tests
        run: >-
          flutter test
          test/routing_config_test.dart
          test/offline_region_test.dart
          test/valhalla_routing_service_test.dart
          test/core/route_recording_store_test.dart
          test/core/offline_package_verifier_test.dart
          test/core/offline_sync_store_test.dart
          test/core/offline_sync_runner_test.dart
          test/core/emergency_share_service_test.dart
          test/core/rescue_link_policy_test.dart

      - name: Full test suite
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info

  rescue-link:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/rescue-link
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: services/rescue-link/go.mod

      - name: Download modules
        run: go mod download

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Tests
        run: go test ./...
