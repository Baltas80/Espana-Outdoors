name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate mobile platform projects
        run: flutter create . --platforms=android,ios --org com.espanaoutdoors

      - name: Apply Android native configuration
        run: python3 tool/configure_mobile_native.py --platform android

      - name: Dependencies
        run: flutter pub get

      - name: Map provider guard
        run: dart run tool/check_map_provider_usage.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Focused routing/offline/safety tests
        run: >-
          flutter test
          test/routing_config_test.dart
          test/offline_region_test.dart
          test/valhalla_routing_service_test.dart
          test/core/route_recording_store_test.dart
          test/core/offline_package_verifier_test.dart
          test/core/offline_sync_store_test.dart
          test/core/offline_sync_runner_test.dart
          test/core/emergency_share_service_test.dart
          test/core/rescue_link_policy_test.dart
          test/remote_source_gateway_test.dart

      - name: Full test suite
        run: flutter test --coverage

      - name: Android release build
        run: |
          flutter build apk --release
          flutter build appbundle --release

      - name: Upload Android build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info

  ios-build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate iOS project
        run: flutter create . --platforms=ios --org com.espanaoutdoors

      - name: Apply iOS native configuration
        run: python3 tool/configure_mobile_native.py --platform ios

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Focused iOS safety and offline tests
        run: >-
          flutter test
          test/routing_config_test.dart
          test/offline_region_test.dart
          test/valhalla_routing_service_test.dart
          test/core/route_recording_store_test.dart
          test/core/offline_package_verifier_test.dart
          test/core/offline_sync_store_test.dart
          test/core/offline_sync_runner_test.dart
          test/core/emergency_share_service_test.dart
          test/core/rescue_link_policy_test.dart
          test/remote_source_gateway_test.dart

      - name: Full iOS test suite
        run: flutter test

      - name: Verify iOS native location configuration
        run: |
          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          path = Path('ios/Runner/Info.plist')
          with path.open('rb') as handle:
              plist = plistlib.load(handle)

          required = {
              'NSLocationWhenInUseUsageDescription',
              'NSLocationAlwaysAndWhenInUseUsageDescription',
          }
          missing = sorted(required - plist.keys())
          if missing:
              raise SystemExit(f'Missing iOS location usage descriptions: {missing}')

          if 'location' not in plist.get('UIBackgroundModes', []):
              raise SystemExit('Missing iOS background location mode.')
          PY

      - name: iOS release build
        run: flutter build ios --release --no-codesign

  rescue-link:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/rescue-link
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: services/rescue-link/go.mod

      - name: Tidy and verify Go modules
        run: go mod tidy

      - name: Show Go module diff
        run: git diff -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Tests
        run: go test ./...

      - name: Container build
        run: docker build -t espana-outdoors-rescue-link:ci .
