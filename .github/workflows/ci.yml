name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform projects
        run: flutter create . --platforms=android,ios,web,windows,macos,linux --org com.espanaoutdoors

      - name: Dependencies
        run: flutter pub get

      - name: Map provider guard
        run: dart run tool/check_map_provider_usage.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Focused routing/offline tests
        run: flutter test test/routing_config_test.dart test/offline_region_test.dart test/valhalla_routing_service_test.dart

      - name: Full test suite
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
