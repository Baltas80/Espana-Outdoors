publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_map: ^8.3.2
  latlong2: ^0.9.1
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  geolocator: ^14.0.3
  connectivity_plus: ^7.3.1
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.2.0
  file_picker: ^13.1.0
  path_provider: ^2.1.6
  gpx: ^2.3.0
  hive_ce_flutter: ^2.3.4
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
