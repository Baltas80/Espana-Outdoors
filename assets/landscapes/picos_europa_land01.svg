<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" role="img" aria-label="Picos de Europa: lago de montaña, bosque y cumbres">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1b5e93"/>
    <stop offset=".42" stop-color="#71b6ce"/>
    <stop offset=".72" stop-color="#f3c77c"/>
    <stop offset="1" stop-color="#e99b57"/>
  </linearGradient>
  <linearGradient id="lake" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8fd3dd"/>
    <stop offset=".5" stop-color="#3d8a96"/>
    <stop offset="1" stop-color="#154e5b"/>
  </linearGradient>
  <linearGradient id="forest" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3d7454"/>
    <stop offset="1" stop-color="#0b2a21"/>
  </linearGradient>
  <linearGradient id="foreground" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2a4e3d"/>
    <stop offset="1" stop-color="#07110e"/>
  </linearGradient>
  <radialGradient id="sun" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#fff4c8" stop-opacity=".98"/>
    <stop offset=".35" stop-color="#ffd078" stop-opacity=".85"/>
    <stop offset="1" stop-color="#ffd078" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
</defs>

<rect width="1080" height="1920" fill="url(#sky)"/>
<circle cx="135" cy="690" r="230" fill="url(#sun)" filter="url(#soft)"/>
<circle cx="135" cy="690" r="54" fill="#ffd37c"/>

<!-- clouds -->
<g fill="#fff5dd" opacity=".45" filter="url(#soft)">
  <path d="M0 360 C170 290 315 330 450 270 C600 205 760 250 1080 170 L1080 410 C835 475 610 405 420 470 C240 530 120 490 0 520Z"/>
  <path d="M460 520 C580 470 690 500 760 460 C850 408 970 435 1080 410 L1080 610 C930 630 785 600 680 640 C590 675 510 640 460 610Z"/>
</g>

