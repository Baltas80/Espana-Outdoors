<path d="M0 1030 L150 830 260 930 405 700 530 905 700 690 820 930 960 760 1080 890 V1210 H0Z" fill="#385c63"/>
<path d="M0 1140 L160 900 290 1050 430 820 575 1045 710 800 855 1060 1000 885 1080 990 V1300 H0Z" fill="#24484a"/>

