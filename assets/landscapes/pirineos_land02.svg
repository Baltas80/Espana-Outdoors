<!-- alpine lakes -->
<path d="M280 1160 C365 1110 470 1110 560 1145 C650 1180 720 1225 785 1270 C710 1320 625 1345 540 1338 C430 1330 340 1285 285 1225 C265 1202 260 1178 280 1160Z" fill="url(#lake)"/>
<path d="M580 1265 C700 1215 835 1225 955 1280 C900 1330 805 1350 710 1340 C650 1335 612 1310 580 1265Z" fill="#2f6670" opacity=".9"/>
