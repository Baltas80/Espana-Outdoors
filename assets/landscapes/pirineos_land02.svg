<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" role="img" aria-label="Pirineos: paisaje alpino con lagos, bosque y cumbres nevadas">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#143b6b"/>
    <stop offset=".45" stop-color="#3f7eaa"/>
    <stop offset=".72" stop-color="#e59a64"/>
    <stop offset="1" stop-color="#f3c986"/>
  </linearGradient>
  <linearGradient id="range" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4b6874"/>
    <stop offset="1" stop-color="#1c3034"/>
  </linearGradient>
  <linearGradient id="forest" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4f7b58"/>
    <stop offset="1" stop-color="#0c261e"/>
  </linearGradient>
  <linearGradient id="lake" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#86c6ca"/>
    <stop offset=".55" stop-color="#3e777d"/>
    <stop offset="1" stop-color="#173e46"/>
  </linearGradient>
  <linearGradient id="trail" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#b89069"/>
    <stop offset="1" stop-color="#6f4c37"/>
  </linearGradient>
  <radialGradient id="sun">
    <stop offset="0" stop-color="#fff3c8" stop-opacity=".98"/>
    <stop offset=".45" stop-color="#ffd27c" stop-opacity=".75"/>
    <stop offset="1" stop-color="#ffd27c" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="20"/></filter>
</defs>

<rect width="1080" height="1920" fill="url(#sky)"/>
<circle cx="870" cy="590" r="250" fill="url(#sun)" filter="url(#soft)"/>
<circle cx="870" cy="590" r="48" fill="#ffd57e"/>

<g fill="#fff0da" opacity=".42" filter="url(#soft)">
  <path d="M0 330 C210 270 330 330 500 255 C700 170 850 250 1080 180 L1080 420 C870 500 650 420 465 485 C285 545 150 490 0 520Z"/>
</g>

<!-- distant Pyrenean range -->
<path d="M0 980 L100 820 205 900 330 640 455 850 575 520 700 835 825 605 940 820 1080 690 V1110 H0Z" fill="url(#range)"/>
<path d="M0 1080 L140 900 255 985 385 760 500 965 640 690 770 950 895 760 1080 905 V1220 H0Z" fill="#29464d"/>

<!-- snow fields -->
<g fill="#f2f4ed" opacity=".92">
