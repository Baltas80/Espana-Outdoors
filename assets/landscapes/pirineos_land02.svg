<path d="M615 1300 C730 1260 850 1280 920 1310" fill="none" stroke="#d7eeea" stroke-width="9" opacity=".2"/>

<!-- foreground valley -->
<path d="M0 1390 C180 1310 350 1360 490 1460 C625 1555 770 1510 910 1420 C1000 1365 1050 1380 1080 1410 V1920 H0Z" fill="#122a22"/>
<path d="M0 1530 C170 1445 340 1495 500 1595 C650 1690 820 1630 1080 1515 V1920 H0Z" fill="#081411"/>

<!-- trail -->
<path d="M170 1920 C300 1775 415 1640 470 1510 C505 1428 485 1360 425 1300 C395 1270 407 1240 448 1218 C530 1270 575 1350 566 1440 C548 1575 440 1715 390 1920Z" fill="url(#trail)" opacity=".95"/>
<path d="M260 1920 C365 1770 465 1630 505 1510 C536 1418 515 1350 465 1298" fill="none" stroke="#d8b48a" stroke-width="10" opacity=".38"/>

<!-- rocks and alpine flowers -->
<g fill="#4a554e">
  <ellipse cx="110" cy="1760" rx="135" ry="58"/>
  <ellipse cx="365" cy="1825" rx="165" ry="68"/>
  <ellipse cx="720" cy="1760" rx="150" ry="62"/>
  <ellipse cx="960" cy="1860" rx="170" ry="72"/>
</g>
<g fill="#c77c8f" opacity=".8">
  <circle cx="105" cy="1660" r="8"/><circle cx="145" cy="1690" r="6"/><circle cx="208" cy="1730" r="7"/>
  <circle cx="760" cy="1655" r="7"/><circle cx="810" cy="1680" r="6"/><circle cx="885" cy="1715" r="7"/>
</g>
<g fill="#d7aa6a" opacity=".8">
  <circle cx="170" cy="1710" r="6"/><circle cx="740" cy="1705" r="6"/><circle cx="920" cy="1750" r="5"/>
</g>
</svg>