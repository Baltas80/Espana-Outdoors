  <path d="M575 530 L615 625 650 705 690 838 660 804 630 750 604 700 580 660 548 706 522 730 535 680Z"/>
  <path d="M825 610 L856 675 895 760 940 820 907 804 872 760 845 720 820 680 792 720 770 742 780 695Z"/>
</g>

<!-- rock faces -->
