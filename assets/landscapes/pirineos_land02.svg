  <path d="M505 920 L575 520 690 835 620 945Z"/>
  <path d="M760 935 L825 605 940 820 875 965Z"/>
</g>

<!-- alpine forest -->
<path d="M0 1180 C170 1100 320 1160 470 1095 C650 1015 820 1115 1080 1030 V1455 H0Z" fill="url(#forest)"/>
<g fill="#173e31">
  <path d="M35 1380 l58 -168 58 168z"/>
  <path d="M150 1425 l70 -202 70 202z"/>
  <path d="M300 1360 l60 -173 60 173z"/>
  <path d="M835 1390 l68 -192 68 192z"/>
  <path d="M960 1435 l62 -182 62 182z"/>
